<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">git-workflow — 五道确认门禁的 Git 工作流</title>
  <desc id="hero-desc">左侧是项目名 git-workflow 与一句话介绍：让编码 Agent 在改动代码之前先停下来问你。右侧是一张确认门禁图，沿时间线排列五个琥珀色菱形门禁：分支、提交、推送、合并、删除远程分支，下方是一条等待用户选择的提示。</desc>

  <rect width="1200" height="380" rx="24" fill="#0B0D10"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="23.5" fill="none" stroke="#232A33"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
    <!-- identity -->
    <g id="title-block" transform="translate(64 0)">
      <text x="0" y="86" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="16" letter-spacing="2.4" fill="#FFC15E">DSH AGENT SKILL</text>
      <text x="190" y="86" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="16" letter-spacing="2.4" fill="#5E6875">/ GIT WORKFLOW</text>

      <text x="-2" y="178" font-size="72" font-weight="700" letter-spacing="-2" fill="#F3F5F8">git-workflow</text>

      <text x="0" y="232" font-size="26" fill="#B7C0CB">让编码 Agent 在改动代码之前，</text>
      <text x="0" y="272" font-size="28" font-weight="600" fill="#F3F5F8">先停下来问你。</text>

      <text x="0" y="332" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="17" fill="#7D8794">5 道确认门禁 · 主干始终可发布 · MIT</text>
    </g>

    <!-- five confirmation gates -->
    <g id="gates" transform="translate(636 44)">
      <rect width="500" height="292" rx="18" fill="#10141A" stroke="#242C36"/>

      <text x="28" y="41" font-size="18" fill="#F3F5F8"><tspan fill="#FFC15E">›</tspan> 五道确认门禁</text>
      <text x="472" y="40" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" letter-spacing="1.4" fill="#5E6875">ASK FIRST</text>
      <line x1="28" y1="60" x2="472" y2="60" stroke="#1D242D"/>

      <text x="28" y="90" font-size="18" fill="#7D8794">没有你的确认，Agent 不会继续下一步。</text>

      <!-- timeline -->
      <line x1="28" y1="138" x2="466" y2="138" stroke="#2B333D" stroke-width="2"/>
      <path d="M462 131 L472 138 L462 145" fill="none" stroke="#2B333D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- gate 1: branch -->
      <g transform="translate(72 138)">
        <path d="M0 -11 L11 0 L0 11 L-11 0 Z" fill="#1C1609" stroke="#FFC15E" stroke-width="1.6"/>
        <path d="M0 -4 L4 0 L0 4 L-4 0 Z" fill="#FFC15E"/>
        <text x="0" y="50" text-anchor="middle" font-size="20" font-weight="600" fill="#F3F5F8">分支</text>
        <text x="0" y="76" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" fill="#5E6875">branch</text>
      </g>

      <!-- gate 2: commit -->
      <g transform="translate(161 138)">
        <path d="M0 -11 L11 0 L0 11 L-11 0 Z" fill="#1C1609" stroke="#FFC15E" stroke-width="1.6"/>
        <path d="M0 -4 L4 0 L0 4 L-4 0 Z" fill="#FFC15E"/>
        <text x="0" y="50" text-anchor="middle" font-size="20" font-weight="600" fill="#F3F5F8">提交</text>
        <text x="0" y="76" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" fill="#5E6875">commit</text>
      </g>

      <!-- gate 3: push -->
      <g transform="translate(250 138)">
        <path d="M0 -11 L11 0 L0 11 L-11 0 Z" fill="#1C1609" stroke="#FFC15E" stroke-width="1.6"/>
        <path d="M0 -4 L4 0 L0 4 L-4 0 Z" fill="#FFC15E"/>
        <text x="0" y="50" text-anchor="middle" font-size="20" font-weight="600" fill="#F3F5F8">推送</text>
        <text x="0" y="76" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" fill="#5E6875">push</text>
      </g>

      <!-- gate 4: merge -->
      <g transform="translate(339 138)">
        <path d="M0 -11 L11 0 L0 11 L-11 0 Z" fill="#1C1609" stroke="#FFC15E" stroke-width="1.6"/>
        <path d="M0 -4 L4 0 L0 4 L-4 0 Z" fill="#FFC15E"/>
        <text x="0" y="50" text-anchor="middle" font-size="20" font-weight="600" fill="#F3F5F8">合并</text>
        <text x="0" y="76" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" fill="#5E6875">merge</text>
      </g>

      <!-- gate 5: delete remote branch -->
      <g transform="translate(428 138)">
        <path d="M0 -11 L11 0 L0 11 L-11 0 Z" fill="#1C1609" stroke="#FFC15E" stroke-width="1.6"/>
        <path d="M0 -4 L4 0 L0 4 L-4 0 Z" fill="#FFC15E"/>
        <text x="0" y="50" text-anchor="middle" font-size="20" font-weight="600" fill="#F3F5F8">删远程</text>
        <text x="0" y="76" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" fill="#5E6875">delete</text>
      </g>

      <!-- live confirmation prompt -->
      <rect x="28" y="236" width="444" height="36" rx="8" fill="#0A0C0F" stroke="#242C36"/>
      <text x="44" y="260" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="16" fill="#C6CDD7"><tspan fill="#FFC15E">›</tspan> 是否创建新分支？</text>
      <text x="456" y="260" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#5E6875">WAITING</text>
    </g>
  </g>
</svg>
